# Publica el servidor intermedio MIA ↔ Xubio (carpeta functions/) en Firebase.
# Se ejecuta solo cuando cambia algo en functions/, o a mano desde la pestaña "Actions".
# Usa secretos del repo (Settings → Secrets and variables → Actions), que nunca quedan a la vista:
#   FIREBASE_SERVICE_ACCOUNT  → JSON de la cuenta de servicio con permiso para publicar funciones
#   XUBIO_CLIENT_ID / XUBIO_SECRET_ID → credenciales de la API de Xubio
name: Publicar servidor Xubio
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --prefix functions --omit=dev
      - name: Credenciales
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          XID: ${{ secrets.XUBIO_CLIENT_ID }}
          XSEC: ${{ secrets.XUBIO_SECRET_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$XID" ] || [ -z "$XSEC" ]; then echo "Faltan secretos del repo (FIREBASE_SERVICE_ACCOUNT, XUBIO_CLIENT_ID, XUBIO_SECRET_ID)"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          printf 'XUBIO_CLIENT_ID=%s\nXUBIO_SECRET_ID=%s\n' "$XID" "$XSEC" > functions/.env
      - name: Publicar en Firebase
        run: npx --yes firebase-tools@13 deploy --only functions --project mzlatam-app --force --non-interactive
      - name: Borrar credenciales temporales
        if: always()
        run: rm -f functions/.env "$RUNNER_TEMP/sa.json"
