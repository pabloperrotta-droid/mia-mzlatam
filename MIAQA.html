<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #F5F4F2; }
  #root { min-height: 100vh; }
  /* Manito de "arrastrar para scrollear" en las grillas de Cashflow (Ingresos,
     Egresos, Salidas Semanales, CASH, Bancos, Simulación) y en sus encabezados
     flotantes — para que se note, antes de hacer click, que se puede mover el
     contenido para los costados en vez de tener que ir a buscar la barra de
     scroll de abajo. Los inputs, botones y links de adentro mantienen su
     cursor normal (de texto / de mano de click) en vez de heredar la manito
     de arrastre, para no confundir "puedo escribir acá" con "puedo arrastrar
     esto". Mientras se está arrastrando de verdad, el cursor pasa a "grabbing"
     (manito cerrada) por JS — ver attachDragScroll / attachDragScrollProxy.
  */
  .cf-hscroll, .cf-hscroll-floating, .pagos-scroll { cursor: grab; }
  .cf-hscroll input, .cf-hscroll textarea, .cf-hscroll select, .cf-hscroll a,
  .pagos-scroll input, .pagos-scroll textarea, .pagos-scroll select, .pagos-scroll a { cursor: auto; }
  .cf-hscroll button, .pagos-scroll button { cursor: pointer; }
</style>
