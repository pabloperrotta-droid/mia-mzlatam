<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { color-scheme: only light; }
  /* En celulares (Chrome / Samsung Internet en Android, Safari en iPhone): que el
     navegador no agrande el texto por su cuenta ("text autosizing"), porque agranda
     solo algunos bloques y rompe las columnas de las tablas. */
  html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: #F5F4F2; font-variant-numeric: tabular-nums; }
  /* Sección 95: foco visible al usar el teclado, menú de herramientas y pestañas principales. */
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-visible {
    outline: 2px solid #C9A227; outline-offset: 2px;
  }
  .menu-item:hover { background: #F3EFE3 !important; }
  .pestana-principal:hover { color: #fff !important; }
  #root { min-height: 100vh; }
  /* Manito de "arrastrar para scrollear" en las grillas de Cashflow (Ingresos,
     Egresos, Salidas Semanales, CASH, Bancos, Simulación) y en sus encabezados
     flotantes — para que se note, antes de hacer click, que se puede mover el
     contenido para los costados en vez de tener que ir a buscar la barra de
     scroll de abajo. Los inputs, botones y links de adentro mantienen su
     cursor normal (de texto / de mano de click) en vez de heredar la manito
     de arrastre, para no confundir "puedo escribir acá" con "puedo arrastrar
     esto". Mientras se está arrastrando de verdad, el cursor pasa a "grabbing"
     (manito cerrada) por JS — ver attachDragScroll / attachDragScrollProxy.
  */
  .cf-hscroll, .cf-hscroll-floating, .pagos-scroll { cursor: grab; }
  .cf-hscroll input, .cf-hscroll textarea, .cf-hscroll select, .cf-hscroll a,
  .pagos-scroll input, .pagos-scroll textarea, .pagos-scroll select, .pagos-scroll a { cursor: auto; }
  .cf-hscroll button, .pagos-scroll button { cursor: pointer; }
</style>
